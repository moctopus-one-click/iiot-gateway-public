listener 1883 0.0.0.0
allow_anonymous false
per_listener_settings false
persistence true
persistence_location /mosquitto/data/
log_dest stdout

# dynamic-security: administra credenciales/ACL por-cliente vía la API de
# control en $CONTROL/dynamic-security/v1. Con dynsec cargado, un cliente
# anónimo ya no tenía NINGÚN permiso de pub/sub desde antes de este cambio
# (deny-by-default, keyed por username — un anónimo no tiene username al
# que atarle un rol). allow_anonymous=false no es lo que corta el acceso a
# los tópicos — dynsec ya lo hacía — esto solo cierra la conexión anónima
# en sí (el CONNECT), un paso de higiene de superficie, no de autorización.
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json
# Bootstrap del admin: password_init_file solo se lee la PRIMERA vez que
# dynamic-security.json no existe (confirmado en el código fuente del
# plugin, dynsec__config_load() en config.c — el fopen() del config_file
# falla, recién ahí se llama a dynsec__config_init() y se consulta este
# archivo). Una vez que dynamic-security.json ya existe (cualquier reinicio
# posterior), esta directiva se ignora por completo — es seguro dejarla
# permanentemente, no hay que retirarla a mano. Mantenerla además permite
# auto-repararse si el volumen se corrompe (SD de una Jetson/RPi, etc.):
# el admin se recrea con la misma contraseña que ya tiene MQTT_INGEST_
# ADMIN_PASSWORD en .env, sin quedar desincronizado.
plugin_opt_password_init_file /mosquitto/config/password_init
