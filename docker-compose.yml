services:
  gateway:
    image: ghcr.io/moctopus-one-click/iiot-gateway:${GATEWAY_VERSION:-latest}
    # build: .  # solo para desarrollo local
    container_name: moctopus-gateway
    restart: unless-stopped

    ports:
      - "${GATEWAY_PORT:-3000}:3000"

    environment:
      NODE_ENV: production
      PORT: 3000

      # Base de datos — apunta al volumen persistente
      DATABASE_URL: "file:/data/gateway.db"

      # JWT — CAMBIAR en producción
      JWT_SECRET: "${JWT_SECRET}"

      # ID del gateway — único por instalación
      GATEWAY_ID: "${GATEWAY_ID:-gateway-001}"

      # URL del frontend (para CORS) — en producción es el mismo origen
      URL_FRONTEND: "${URL_FRONTEND:-http://localhost:3000}"
      STATIC_ROOT: /app/ui/dist

      # Ingesta MQTT (devices que publican su propia telemetría) — ver
      # contrato-ingesta-mqtt-moctopus.md. Credenciales generadas por
      # install.sh en la instalación inicial.
      MQTT_INGEST_ENABLED: "${MQTT_INGEST_ENABLED:-true}"
      MQTT_INGEST_BROKER_URL: "${MQTT_INGEST_BROKER_URL:-mqtt://mosquitto:1883}"
      MQTT_INGEST_ADMIN_USERNAME: "${MQTT_INGEST_ADMIN_USERNAME:-admin}"
      MQTT_INGEST_ADMIN_PASSWORD: "${MQTT_INGEST_ADMIN_PASSWORD}"
      MQTT_INGEST_SUBSCRIBER_USERNAME: "${MQTT_INGEST_SUBSCRIBER_USERNAME:-gateway-ingest}"
      MQTT_INGEST_SUBSCRIBER_PASSWORD: "${MQTT_INGEST_SUBSCRIBER_PASSWORD}"

    volumes:
      # Volumen persistente para la base de datos SQLite
      # Los datos sobreviven a reinicios y actualizaciones del contenedor
      - gateway_data:/data

    networks:
      - moctopus

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Copia password_init al volumen interno mosquitto_init_data con dueño
  # mosquitto:mosquitto y permisos 700, resuelto por NOMBRE contra el
  # /etc/passwd de la propia imagen (no por UID numérico). Corre como root
  # (nadie le puso "user:"), así que puede leer el archivo del host sin
  # importar qué UID lo creó ahí. Necesario porque Mosquitto viene
  # anunciando que en una futura versión va a rechazar password_init si no
  # tiene exactamente ese dueño/permiso dentro del container, algo que un
  # bind mount directo del host no puede garantizar (el UID del host no
  # tiene por qué coincidir con el UID interno de "mosquitto" en la imagen).
  mosquitto-init:
    image: eclipse-mosquitto:2
    container_name: moctopus-mosquitto-init
    volumes:
      - ./mosquitto/password_init:/src/password_init:ro
      - mosquitto_init_data:/mosquitto/config/init
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "cp /src/password_init /mosquitto/config/init/password_init &&
       chown mosquitto:mosquitto /mosquitto/config/init/password_init &&
       chmod 700 /mosquitto/config/init/password_init"
    networks:
      - moctopus

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: moctopus-mosquitto
    restart: unless-stopped
    depends_on:
      mosquitto-init:
        condition: service_completed_successfully
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_init_data:/mosquitto/config/init:ro
      - mosquitto_data:/mosquitto/data
    networks:
      - moctopus

volumes:
  gateway_data:
    driver: local
  mosquitto_init_data:
    driver: local
  mosquitto_data:
    driver: local

networks:
  moctopus:
    driver: bridge
